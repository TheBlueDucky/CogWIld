<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cogwild sign-in</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #121a33; color: #e6ecff; font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 16px; box-sizing: border-box; }
  .box { width: min(420px, 100%); background: #1a2342; border: 1px solid rgba(255, 255, 255, .11); border-radius: 10px; padding: 24px; text-align: center; }
  .ico { font-size: 44px; }
  h1 { font-size: 20px; margin: 8px 0; }
  p { color: #9fb3d9; margin: 6px 0; }
  .bad h1 { color: #ff8a8a; }
</style>
</head>
<body>
  <div class="box" id="box">
    <div class="ico" id="ico">⏳</div>
    <h1 id="title">Signing you in…</h1>
    <p id="text">One moment.</p>
  </div>
  <script src="/js/auth-done.js"></script>
</body>
</html>
