<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cogwild short</title>
<style>
  @font-face { font-family: 'Lilita One'; src: url('../../fonts/lilita-one-latin.woff2') format('woff2'); }
  html, body { margin: 0; background: transparent; }
</style>
</head>
<body>
<script>
// The pieces of the vertical short (tools/video/short.js): the 1-second logo hook, the "DOWNLOAD NOW" text (on a
// see-through background, laid over the last clip) and the edit's sound hits. Each frame is drawn for a time t and
// handed back as a PNG, so nothing here depends on real time.
const W = 1080, H = 1920;
const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const lay = document.createElement('canvas'); lay.width = W; lay.height = H;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const k = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ease = { out: (x) => 1 - Math.pow(1 - x, 3), in: (x) => x * x * x, back: (x) => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); } };
let s0 = 11; const R = () => { s0 = (s0 * 16807) % 2147483647; return s0 / 2147483647; };

function gearPath(c, r) {
  const u = r / 25;
  c.beginPath();
  c.arc(0, 0, 15 * u, 0, Math.PI * 2);
  for (let i = 0; i < 8; i++) {
    c.save(); c.rotate((i * Math.PI) / 4);
    const x = -4 * u, y = -25 * u, w = 8 * u, h = 12 * u, rr = 2 * u;
    c.moveTo(x + rr, y); c.lineTo(x + w - rr, y); c.quadraticCurveTo(x + w, y, x + w, y + rr); c.lineTo(x + w, y + h); c.lineTo(x, y + h); c.lineTo(x, y + rr); c.quadraticCurveTo(x, y, x + rr, y);
    c.restore();
  }
}
function gear(c, x, y, r, rot) {
  c.save(); c.translate(x, y); c.rotate(rot);
  gearPath(c, r); c.fillStyle = '#ffc43d'; c.fill();
  c.beginPath(); c.arc(0, 0, (6 / 25) * r, 0, 6.28); c.fillStyle = '#3a86ff'; c.fill();
  c.restore();
}
// the wordmark for a tall screen, on two lines: C ⚙ G (gold) over W I L D (white), centred at (0, 0)
const FS = 340;
function lineWidths(c) {
  c.font = `${FS}px 'Lilita One'`;
  const gw = FS * 0.74, wc = c.measureText('C').width, wg = c.measureText('G').width;
  return { gw, wc, wg, top: wc + gw + wg + 16 };
}
function gearPos(c) { const m = lineWidths(c); return { x: -m.top / 2 + m.wc + 8 + m.gw / 2, y: -FS * 0.36 - FS * 0.5 }; }
function wordmark(c, gearRot) {
  const m = lineWidths(c);
  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  const y1 = -FS * 0.5, y2 = FS * 0.5;
  let x = -m.top / 2;
  c.fillStyle = '#b8741a'; c.fillText('C', x + m.wc / 2, y1 + 14); c.fillStyle = '#ffc43d'; c.fillText('C', x + m.wc / 2, y1);
  x += m.wc + 8;
  gear(c, x + m.gw / 2, y1 - FS * 0.36, FS * 0.37, gearRot);
  x += m.gw + 8;
  c.fillStyle = '#b8741a'; c.fillText('G', x + m.wg / 2, y1 + 14); c.fillStyle = '#ffc43d'; c.fillText('G', x + m.wg / 2, y1);
  c.fillStyle = '#2c63c9'; c.fillText('WILD', 0, y2 + 14); c.fillStyle = '#fff'; c.fillText('WILD', 0, y2);
}

// ---------- the hook (see-through where the game shows) ----------
// 0.00-0.58 only the logo on a dark navy background, spinning fast like a coin (3 turns); 0.58-0.72 it stops face-on and its
// letters turn into windows onto the game (playing underneath); 0.72-1.20 a dive through the gear into the match
const HOOK = 1.2, REVEAL = 0.6;
const dust = Array.from({ length: 70 }, () => ({ x: R() * W, y: R() * H, v: 30 + R() * 90, s: 1 + R() * 2.4 }));
function hook(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  // the dark background (like the long videos' intro, darker): navy fading to almost black, faint drifting dust
  const bg = ctx.createRadialGradient(W / 2, H * 0.44, 40, W / 2, H * 0.5, H * 0.72);
  bg.addColorStop(0, '#16224a'); bg.addColorStop(0.5, '#0b1228'); bg.addColorStop(1, '#03050c');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  for (const d of dust) { ctx.fillStyle = `rgba(150,190,255,${0.18 + 0.12 * Math.sin(t * 9 + d.x)})`; ctx.beginPath(); ctx.arc(d.x, (d.y - t * d.v + H) % H, d.s, 0, 6.28); ctx.fill(); }
  // the logo: grows in fast and spins round its middle (3 turns, slowing to face-on)
  const grow = ease.out(k(t, 0, 0.18));
  const spin = ease.out(k(t, 0, 0.58));
  const ang = spin * Math.PI * 6; // 3 turns (it ends face-on, not mirrored)
  const c = Math.cos(ang);
  const dive = ease.in(k(t, 0.72, 1.18));
  const sc = (0.4 + 0.6 * grow) * (1 + dive * 45);
  const L = lay.getContext('2d');
  L.setTransform(1, 0, 0, 1, 0, 0); L.clearRect(0, 0, W, H);
  L.translate(W / 2, H * 0.46);
  const g = gearPos(L);
  L.translate(-g.x * sc * dive, -g.y * sc * dive);
  L.scale(sc * (Math.abs(c) < 0.06 ? 0.06 * Math.sign(c || 1) : c), sc);
  const win = t >= REVEAL; // the letters are windows from here on
  if (!win) { L.shadowColor = 'rgba(0,0,0,0.6)'; L.shadowBlur = 40; L.shadowOffsetY = 20; }
  wordmark(L, t * 30);
  if (!win) {
    // a glint on the logo as it turns, then the logo itself
    ctx.drawImage(lay, 0, 0);
    if (Math.abs(c) > 0.8) { ctx.save(); ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = `rgba(255,255,255,${0.15 * Math.abs(Math.sin(ang * 2))})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  } else {
    // windows: cut the letters' shape out of the background (the game shows through), with a gold rim glowing
    // round them for a moment
    const rim = 1 - k(t, REVEAL, REVEAL + 0.25);
    if (rim > 0) { ctx.save(); ctx.shadowColor = `rgba(255,196,61,${rim})`; ctx.shadowBlur = 50; ctx.globalAlpha = rim; ctx.drawImage(lay, 0, 0); ctx.restore(); }
    ctx.save(); ctx.globalCompositeOperation = 'destination-out'; ctx.drawImage(lay, 0, 0); ctx.restore();
    // and everything thins out at the very end of the dive
    const fade = k(t, 1.05, 1.2);
    if (fade > 0) { ctx.save(); ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  }
}

// ---------- a light leak (warm and cool glows drifting across), for the transitions ----------
const LEAK = 0.6;
function leak(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  const a = Math.sin(Math.PI * k(t, 0, LEAK));
  ctx.globalCompositeOperation = 'lighter';
  for (const [x0, y0, r, col] of [[-200 + t * 1400, 500, 900, '255,140,40'], [W + 100 - t * 1200, 1300, 800, '80,200,255'], [W * 0.5, -200 + t * 900, 700, '255,220,150']]) {
    const g2 = ctx.createRadialGradient(x0, y0, 0, x0, y0, r);
    g2.addColorStop(0, `rgba(${col},${0.55 * a})`); g2.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ---------- "DOWNLOAD NOW": straight, light grey-white with a heavy soft shadow, blending into the game ----------
const CTA = 2.6;
function cta(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  const a = ease.out(k(t, 0, 0.45));
  const s = 1.08 - 0.08 * a;
  ctx.translate(W / 2, H * 0.45); ctx.scale(s, s);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const [word, size, y, sp] of [['DOWNLOAD', 150, -95, 10], ['NOW', 250, 105, 18]]) {
    ctx.font = `${size}px 'Lilita One'`;
    if (ctx.letterSpacing !== undefined) ctx.letterSpacing = `${sp + (1 - a) * 30}px`;
    // a wide dark shadow that sinks it into the picture, a closer one for depth, then the letters (a little see-through)
    ctx.save(); ctx.globalAlpha = 0.75 * a; ctx.shadowColor = 'rgba(0,0,0,0.95)'; ctx.shadowBlur = 70; ctx.shadowOffsetY = 26; ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillText(word, 0, y); ctx.restore();
    ctx.save(); ctx.globalAlpha = 0.6 * a; ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8; ctx.fillStyle = 'rgba(20,24,34,0.6)'; ctx.fillText(word, 0, y + 4); ctx.restore();
    const gr = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2);
    gr.addColorStop(0, 'rgba(244,246,250,0.95)'); gr.addColorStop(1, 'rgba(186,194,208,0.92)');
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = gr; ctx.fillText(word, 0, y); ctx.restore();
  }
}

window.ready = document.fonts.load(`200px 'Lilita One'`).then(() => true);
window.LEN = { hook: HOOK, cta: CTA, leak: LEAK, reveal: REVEAL };
window.frame = (kind, t) => { ({ hook, cta, leak })[kind](t); return cv.toDataURL('image/png').slice(22); };

// ---------- the sound hits for the edit (no music: the song goes on top) ----------
// list: [[time, kind]], kind = slam | whoosh | hit | riser | boom | spin
window.sfx = async (list, len) => {
  const SR = 48000, a = new OfflineAudioContext(1, Math.ceil(len * SR), SR);
  const out = a.createDynamicsCompressor(); out.threshold.value = -12; out.ratio.value = 4; out.connect(a.destination);
  const nb = a.createBuffer(1, SR * 2, SR); { const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1; }
  const noise = (t, dur, f0, f1, q, vol, type) => {
    const s = a.createBufferSource(); s.buffer = nb; const f = a.createBiquadFilter(); f.type = type || 'bandpass'; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + dur + 0.05);
  };
  const tone = (t, f, dur, type, vol, to) => {
    const o = a.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.05);
  };
  for (const [t, kind] of list) {
    if (kind === 'slam') { tone(t, 140, 0.7, 'sine', 0.9, 30); noise(t, 0.5, 4000, 300, 0.7, 0.7, 'lowpass'); for (const f of [523, 1187, 1846]) tone(t, f, 0.9, 'sine', 0.06); }
    if (kind === 'whoosh') noise(t - 0.12, 0.3, 500, 5000, 1.1, 0.45);
    if (kind === 'hit') { tone(t, 110, 0.35, 'sine', 0.6, 40); noise(t, 0.18, 6000, 800, 0.8, 0.35, 'lowpass'); }
    if (kind === 'riser') { noise(t, 0.8, 300, 7000, 1, 0.4); tone(t, 180, 0.8, 'sawtooth', 0.05, 900); }
    if (kind === 'glitch') { for (let i = 0; i < 5; i++) tone(t + i * 0.025, 300 + R() * 2200, 0.02, 'square', 0.12); noise(t, 0.12, 6000, 2000, 2, 0.25, 'highpass'); }
    if (kind === 'spin') { for (let i = 0; i < 6; i++) noise(t + i * 0.09, 0.12, 900 + i * 300, 2600 + i * 400, 1.4, 0.22); }
    if (kind === 'boom') { tone(t, 120, 1.2, 'sine', 1, 28); noise(t, 0.9, 3000, 150, 0.6, 0.8, 'lowpass'); }
  }
  const buf = await a.startRendering(), d = buf.getChannelData(0), pcm = new Int16Array(d.length);
  for (let i = 0; i < d.length; i++) pcm[i] = clamp(d[i], -1, 1) * 32767;
  let s = ''; const u = new Uint8Array(pcm.buffer);
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
};
</script>
</body>
</html>
