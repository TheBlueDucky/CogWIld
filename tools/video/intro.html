<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cogwild intro</title>
<style>
  @font-face { font-family: 'Lilita One'; src: url('../../fonts/lilita-one-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Nunito'; src: url('../../fonts/nunito-latin.woff2') format('woff2'); font-weight: 200 1000; }
  html, body { margin: 0; background: #05070f; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// The video intro (tools/video): the Cogwild logo, built with the game's own font and gear. Time comes from
// performance.now (the recorder's virtual clock makes every frame exact). Its sound is made offline (introAudio).
const W = 1920, H = 1080;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const lay = document.createElement('canvas'); lay.width = W; lay.height = H;
const SUB = decodeURIComponent((location.hash || '#').slice(1)) || 'GAMEPLAY';
const LEN = 5.6;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = { out: (x) => 1 - Math.pow(1 - x, 3), inOut: (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }, in: (x) => x * x * x };
const k = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
// a fixed random, so every render is the same
let s0 = 7; const R = () => { s0 = (s0 * 16807) % 2147483647; return s0 / 2147483647; };
const sparks = Array.from({ length: 140 }, () => ({ x: R() * W, y: R() * H, v: 40 + R() * 160, s: 1 + R() * 3.2, ph: R() * 6.28, hue: R() < 0.7 ? 'gold' : 'cyan' }));
const bgGears = Array.from({ length: 7 }, (_, i) => ({ x: R() * W, y: R() * H, r: 90 + R() * 260, sp: (R() - 0.5) * 0.5, z: 0.3 + R() * 0.7 }));
const burst = Array.from({ length: 90 }, () => ({ a: R() * 6.28, v: 500 + R() * 1500, s: 2 + R() * 5, life: 0.5 + R() * 0.9, c: R() < 0.6 ? '#ffc43d' : R() < 0.5 ? '#5ce1ff' : '#ffffff' }));

function gearPath(c, r) {
  // the logo's gear: a disc and 8 rounded teeth (favicon.svg: r 15, teeth 8 x 12 from -25)
  const u = r / 25;
  c.beginPath();
  c.arc(0, 0, 15 * u, 0, Math.PI * 2);
  for (let i = 0; i < 8; i++) {
    c.save(); c.rotate((i * Math.PI) / 4);
    const x = -4 * u, y = -25 * u, w = 8 * u, h = 12 * u, rr = 2 * u;
    c.moveTo(x + rr, y); c.lineTo(x + w - rr, y); c.quadraticCurveTo(x + w, y, x + w, y + rr); c.lineTo(x + w, y + h); c.lineTo(x, y + h); c.lineTo(x, y + rr); c.quadraticCurveTo(x, y, x + rr, y);
    c.restore();
  }
}
function drawGear(c, x, y, r, rot, alpha, glow) {
  c.save(); c.translate(x, y); c.rotate(rot); c.globalAlpha = alpha;
  if (glow) { c.shadowColor = 'rgba(255,196,61,0.8)'; c.shadowBlur = glow; }
  gearPath(c, r); c.fillStyle = '#ffc43d'; c.fill('nonzero');
  c.shadowBlur = 0;
  c.beginPath(); c.arc(0, 0, (6 / 25) * r, 0, Math.PI * 2); c.fillStyle = '#3a86ff'; c.fill();
  c.restore();
}

// the wordmark layout: C [gear] G W I L D
const FS = 230;
function layout() {
  ctx.font = `${FS}px 'Lilita One'`;
  const letters = [['C', '#ffc43d', '#b8741a'], ['gear'], ['G', '#ffc43d', '#b8741a'], ['W', '#ffffff', '#2c63c9'], ['I', '#ffffff', '#2c63c9'], ['L', '#ffffff', '#2c63c9'], ['D', '#ffffff', '#2c63c9']];
  const gap = 10, gw = FS * 0.74;
  let total = 0;
  for (const l of letters) { l.w = l[0] === 'gear' ? gw : ctx.measureText(l[0]).width; total += l.w + gap; }
  total -= gap;
  let x = W / 2 - total / 2;
  for (const l of letters) { l.x = x + l.w / 2; x += l.w + gap; }
  return letters;
}
let LET = null;
const BASE = 470; // baseline y of the wordmark

function frame(t) {
  if (!LET) LET = layout();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // camera shake after the impact
  const sh = Math.max(0, 1 - (t - 1.45) / 0.5) * (t > 1.45 ? 1 : 0);
  const zoomOut = 1 + ease.in(k(t, 4.75, LEN)) * 0.35;
  ctx.translate(W / 2 + (Math.sin(t * 90) * 14 * sh), H / 2 + (Math.cos(t * 77) * 10 * sh));
  ctx.scale(zoomOut, zoomOut);
  ctx.translate(-W / 2, -H / 2);

  // background: deep blue glow that breathes in
  const bgIn = ease.out(k(t, 0, 0.8));
  const g0 = ctx.createRadialGradient(W / 2, H * 0.45, 50, W / 2, H * 0.5, W * 0.75);
  g0.addColorStop(0, `rgba(40,78,160,${0.95 * bgIn})`); g0.addColorStop(0.45, `rgba(18,26,51,${bgIn})`); g0.addColorStop(1, '#04060d');
  ctx.fillStyle = '#04060d'; ctx.fillRect(-200, -200, W + 400, H + 400);
  ctx.fillStyle = g0; ctx.fillRect(-200, -200, W + 400, H + 400);
  // big slow gears in the dark
  for (const bg of bgGears) {
    ctx.save(); ctx.globalAlpha = 0.07 * bgIn * bg.z;
    ctx.translate(bg.x + Math.sin(t * 0.3 + bg.r) * 20, bg.y - t * 12 * bg.z); ctx.rotate(t * bg.sp + bg.r);
    gearPath(ctx, bg.r); ctx.fillStyle = '#5ce1ff'; ctx.fill(); ctx.restore();
  }
  // light beams sweeping
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const a = -0.5 + Math.sin(t * 0.6 + i * 2.1) * 0.35;
    ctx.save(); ctx.translate(W / 2 + (i - 1) * 420, H + 100); ctx.rotate(a);
    const lg = ctx.createLinearGradient(-90, 0, 90, 0);
    lg.addColorStop(0, 'rgba(92,225,255,0)'); lg.addColorStop(0.5, `rgba(92,225,255,${0.07 * bgIn})`); lg.addColorStop(1, 'rgba(92,225,255,0)');
    ctx.fillStyle = lg; ctx.fillRect(-90, -1800, 180, 1800); ctx.restore();
  }
  // rising sparks
  for (const p of sparks) {
    const y = ((p.y - t * p.v) % H + H) % H, x = p.x + Math.sin(t * 1.3 + p.ph) * 18;
    const a = 0.35 + 0.35 * Math.sin(t * 4 + p.ph);
    ctx.fillStyle = p.hue === 'gold' ? `rgba(255,196,61,${a * bgIn})` : `rgba(92,225,255,${a * bgIn})`;
    ctx.beginPath(); ctx.arc(x, y, p.s, 0, 6.28); ctx.fill();
  }
  ctx.restore();

  // the gear: flies in spinning, grows, then slams into its place in the word
  const slot = LET[1];
  const gr0 = FS * 0.37;
  let gx = W / 2, gy = H / 2, gr = 0, rot = 0, glow = 0;
  if (t < 1.25) { const e = ease.out(k(t, 0.15, 1.25)); gr = gr0 * (0.1 + 2.0 * e); rot = t * 9; glow = 60 * e; }
  else if (t < 1.45) { const e = ease.in(k(t, 1.25, 1.45)); gr = gr0 * (2.1 - 1.1 * e); gx = W / 2 + (slot.x - W / 2) * e; gy = H / 2 + (BASE - FS * 0.36 - H / 2) * e; rot = t * 9; glow = 60; }
  else { gr = gr0 * (1 + 0.12 * Math.max(0, 1 - (t - 1.45) / 0.25) * Math.sin((t - 1.45) * 40)); gx = slot.x; gy = BASE - FS * 0.36; rot = 1.45 * 9 + (t - 1.45) * 1.1; glow = 25 + 25 * Math.max(0, 1 - (t - 1.45) * 2); }
  // impact: a flash and a ring
  if (t > 1.45 && t < 2.4) {
    const e = k(t, 1.45, 2.4);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(255,220,140,${(1 - e) * 0.9})`; ctx.lineWidth = 18 * (1 - e) + 2;
    ctx.beginPath(); ctx.arc(gx, gy, 60 + ease.out(e) * 900, 0, 6.28); ctx.stroke();
    ctx.strokeStyle = `rgba(92,225,255,${(1 - e) * 0.6})`; ctx.lineWidth = 8 * (1 - e) + 1;
    ctx.beginPath(); ctx.arc(gx, gy, 40 + ease.out(k(t, 1.5, 2.4)) * 650, 0, 6.28); ctx.stroke();
    for (const b of burst) {
      const bt = t - 1.45;
      if (bt > b.life) continue;
      const d = b.v * bt * (1 - bt / (2 * b.life)), x = gx + Math.cos(b.a) * d, y = gy + Math.sin(b.a) * d + 300 * bt * bt;
      ctx.globalAlpha = 1 - bt / b.life; ctx.fillStyle = b.c;
      ctx.beginPath(); ctx.arc(x, y, b.s, 0, 6.28); ctx.fill();
    }
    ctx.restore();
  }
  // letters drop in after the slam (drawn on their own layer, so the glint shines only on them)
  const L = lay.getContext('2d');
  L.setTransform(1, 0, 0, 1, 0, 0); L.clearRect(0, 0, W, H);
  L.font = `${FS}px 'Lilita One'`; L.textAlign = 'center'; L.textBaseline = 'alphabetic';
  const order = [0, 2, 3, 4, 5, 6];
  order.forEach((idx, n) => {
    const l = LET[idx], t0 = 1.5 + n * 0.075, e = k(t, t0, t0 + 0.4);
    if (e <= 0) return;
    const bb = ease.back(e), y = BASE - (1 - bb) * 160, sc = 1 + (1 - bb) * 0.5;
    L.save(); L.globalAlpha = clamp(e * 3, 0, 1); L.translate(l.x, y); L.scale(sc, sc);
    L.fillStyle = l[2]; L.fillText(l[0], 0, 12);
    L.fillStyle = l[1]; L.fillText(l[0], 0, 0);
    L.restore();
  });
  if (gr > 0) drawGear(L, gx, gy, gr, rot, 1, 0);
  const gl = k(t, 2.55, 3.25);
  if (gl > 0 && gl < 1) {
    L.save(); L.globalCompositeOperation = 'source-atop';
    const gx0 = LET[0].x - 250 + (LET[6].x - LET[0].x + 500) * ease.inOut(gl);
    L.translate(0, BASE - 80); L.transform(1, 0, -0.35, 1, 0, 0);
    const lg = L.createLinearGradient(gx0 - 110, 0, gx0 + 110, 0);
    lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,255,0.75)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    L.fillStyle = lg; L.fillRect(gx0 - 110, -200, 220, 400);
    L.restore();
  }
  // the layer on the scene: a soft dark shadow under it, a glow around the gear
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 22; ctx.drawImage(lay, 0, 0); ctx.restore();
  if (gr > 0 && glow) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35; drawGear(ctx, gx, gy, gr, rot, 1, glow); ctx.restore(); drawGear(ctx, gx, gy, gr, rot, 1, 0); }
  // the subtitle: a line opens, the words slide out of it
  const ln = ease.out(k(t, 2.15, 2.6));
  if (ln > 0) {
    const y = BASE + 105;
    ctx.save();
    const lw = 760 * ln;
    const lg = ctx.createLinearGradient(W / 2 - lw / 2, 0, W / 2 + lw / 2, 0);
    lg.addColorStop(0, 'rgba(92,225,255,0)'); lg.addColorStop(0.5, 'rgba(92,225,255,0.95)'); lg.addColorStop(1, 'rgba(92,225,255,0)');
    ctx.fillStyle = lg; ctx.fillRect(W / 2 - lw / 2, y, lw, 4);
    const te = ease.out(k(t, 2.3, 2.85));
    ctx.beginPath(); ctx.rect(0, y + 6, W, 120); ctx.clip();
    ctx.font = `86px 'Lilita One'`; ctx.textAlign = 'center';
    if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '14px';
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    ctx.fillStyle = '#ffffff'; ctx.fillText(SUB.toUpperCase(), W / 2 + 7, y + 96 - (1 - te) * 110);
    ctx.restore();
    const ta = ease.out(k(t, 2.9, 3.5));
    ctx.save(); ctx.globalAlpha = ta; ctx.font = `600 34px 'Nunito'`; ctx.textAlign = 'center'; ctx.fillStyle = '#9fb3d9';
    ctx.fillText('Build any mech. Rule the land, water and sky.', W / 2, y + 168 + (1 - ta) * 14);
    ctx.restore();
  }
  // the end: everything rushes at you
  const out = k(t, 5.0, LEN);
  if (out > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255,255,255,${ease.in(out) * 0.9})`; ctx.fillRect(0, 0, W, H); }
}

let start = null;
function loop(now) { if (start === null) start = now; frame((now - start) / 1000); requestAnimationFrame(loop); }
window.introReady = document.fonts.load(`${FS}px 'Lilita One'`).then(() => document.fonts.load(`600 34px 'Nunito'`)).then(() => { LET = null; return true; });
window.introGo = () => { start = null; requestAnimationFrame(loop); return true; };
window.INTRO_LEN = LEN;

// the sound: a riser into a big metal slam, a note per letter, a shimmer on the glint, a pad under it all, a whoosh out
window.introAudio = async () => {
  const SR = 48000, N = Math.ceil(LEN * SR);
  const a = new OfflineAudioContext(1, N, SR);
  const master = a.createGain(); master.gain.value = 0.62; master.connect(a.destination);
  const comp = a.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(master);
  const out = comp;
  const noiseBuf = a.createBuffer(1, SR * 3, SR); { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1; }
  const noise = (t, dur, f0, f1, q, vol, type) => {
    const s = a.createBufferSource(); s.buffer = noiseBuf;
    const f = a.createBiquadFilter(); f.type = type || 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.85); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + dur + 0.05);
  };
  const tone = (t, f, dur, type, vol, slideTo, attack) => {
    const o = a.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (attack || 0.005)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.05);
  };
  // riser
  noise(0.1, 1.35, 250, 4200, 1.2, 0.5);
  tone(0.15, 70, 1.3, 'sawtooth', 0.08, 320, 1.1);
  // the slam
  const T = 1.45;
  tone(T, 130, 0.9, 'sine', 0.95, 32);
  { const s = a.createBufferSource(); s.buffer = noiseBuf; const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(3000, T); f.frequency.exponentialRampToValueAtTime(200, T + 1.2);
    const g = a.createGain(); g.gain.setValueAtTime(0.8, T); g.gain.exponentialRampToValueAtTime(0.0001, T + 1.4); s.connect(f).connect(g).connect(out); s.start(T); s.stop(T + 1.5); }
  for (const [f, v] of [[523, 0.12], [1187, 0.08], [1846, 0.06], [2731, 0.035]]) tone(T, f, 1.8, 'sine', v);
  // letters
  [523.25, 659.25, 783.99, 880, 1046.5, 1318.5].forEach((f, n) => tone(1.5 + n * 0.075 + 0.12, f, 0.35, 'triangle', 0.09));
  // pad (A minor), swelling after the slam
  for (const f of [110, 220, 261.63, 329.63, 440]) {
    const o = a.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = (R() - 0.5) * 14;
    const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(400, T); lp.frequency.linearRampToValueAtTime(1600, 4.5);
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, T); g.gain.exponentialRampToValueAtTime(0.03, T + 0.6); g.gain.setValueAtTime(0.03, 4.6); g.gain.exponentialRampToValueAtTime(0.0001, LEN);
    o.connect(lp).connect(g).connect(out); o.start(T); o.stop(LEN);
  }
  // subtitle whoosh + glint shimmer
  noise(2.15, 0.6, 800, 3000, 0.8, 0.18);
  [2093, 2637, 3136, 4186].forEach((f, n) => tone(2.62 + n * 0.06, f, 0.5, 'sine', 0.035));
  // out: a rush up to the flash
  noise(4.6, 1.0, 400, 6000, 0.9, 0.55);
  tone(4.7, 200, 0.9, 'sine', 0.12, 900, 0.85);
  const buf = await a.startRendering();
  const d = buf.getChannelData(0), pcm = new Int16Array(d.length);
  for (let i = 0; i < d.length; i++) pcm[i] = Math.max(-1, Math.min(1, d[i])) * 32767;
  return pcm;
};
</script>
</body>
</html>
